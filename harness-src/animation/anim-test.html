<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#10121a" />
    <title>Animated GLB test harness</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: #10121a; color: #dfe4f2; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
      canvas { display: block; touch-action: none; }

      /* The gradient lets the rows read against the 3D scene behind them, the same way
         the materials harness fades its own top bar. */
      #ui { position: fixed; top: 0; left: 0; right: 0; padding: 10px 12px 6px; z-index: 2;
            background: linear-gradient(#10121aee 60%, #10121a00); }

      /* One horizontally-scrolling line per list. 40 mons + 17 clips previously wrapped
         into ~14 rows and covered 86% of a phone screen. Same pattern as
         materials-harness/index.html. */
      .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
             padding-bottom: 5px; }
      .row::-webkit-scrollbar { display: none; }

      button { background: #232a3d; color: #dfe4f2; border: 1px solid #3a445e; border-radius: 5px;
               padding: 4px 9px; cursor: pointer; font: inherit; flex: none; white-space: nowrap; }
      button:hover { background: #303a54; }
      button.on { background: #4d6bff; border-color: #4d6bff; color: #fff; }

      /* white-space:pre cannot wrap, so without a scroll box the readout ran 457 px past
         the right edge of a 375 px viewport. */
      #readout { position: fixed; bottom: 0; left: 0; max-width: 100vw; overflow-x: auto;
                 padding: 10px 12px; white-space: pre; z-index: 2;
                 background: rgba(16,18,26,.85); border-top-right-radius: 6px;
                 padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
      h1 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }

      @media (max-width: 480px) {
        /* The post's prose already says what this heading says, and it cost 39 px. */
        h1 { display: none; }
        button { padding: 6px 10px; }
        #readout { font-size: 11px; padding: 8px 10px; }
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h1>animated GLB (left, green grid) vs shipped static GLB (right) &mdash; 1 m reference cube</h1>
      <div class="row" id="mons"></div>
      <div class="row" id="clips"></div>
    </div>
    <div id="readout"></div>
    <script type="module" src="/src/animtest.js"></script>
  </body>
</html>
