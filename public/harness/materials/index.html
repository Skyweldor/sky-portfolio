<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#10121a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Materials Harness</title>
<style>
  :root { --bg:#10121a; --panel:#181b26; --line:#2a3145; --on:#4d6bff; --txt:#e6e9f2; --dim:#8d95ad;
          --sheet:300px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
               font:14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display:block; touch-action:none; }

  #top { position:fixed; top:0; left:0; right:0; z-index:3;
         padding:calc(env(safe-area-inset-top) + 6px) 8px 2px;
         background:linear-gradient(#10121aee 55%, #10121a00); }
  .row { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:5px; }
  .row::-webkit-scrollbar { display:none; }

  button { font:inherit; color:var(--txt); background:var(--panel); border:1px solid var(--line);
           border-radius:9px; padding:8px 11px; min-height:38px; white-space:nowrap; cursor:pointer; }
  button.on { background:var(--on); border-color:var(--on); color:#fff; }
  button.ghost { background:transparent; color:var(--dim); padding:6px 9px; min-height:32px;
                 font-size:12px; }
  button.ghost.on { background:var(--on); border-color:var(--on); color:#fff; }

  #status { position:fixed; left:8px; right:8px; z-index:3; bottom:calc(var(--sheet) + 8px);
            background:var(--panel); border:1px solid var(--line); border-radius:11px;
            padding:8px 10px; }
  #partsBar { display:flex; gap:6px; align-items:center; }
  #partsBar #parts { flex:1; min-width:0; padding-bottom:0; scroll-behavior:smooth; }
  button.step { padding:0 9px; min-width:32px; min-height:32px; font-size:16px; line-height:1;
                flex:none; }
  button.part { padding:6px 9px; min-height:32px; font-size:12px; }
  button.part.inherited { border-color:#3d4a7a; }     /* texture comes from a coarser tier */
  button.part.set { border-color:var(--on); }          /* this tier has its own override */
  button.part.split::after { content:'*'; margin-left:3px; opacity:.7; }  /* finer overrides win */
  #hint { color:var(--dim); font-size:12px; margin-top:5px; }
  #scaleRow { display:flex; align-items:center; gap:9px; margin-top:7px; }
  #scaleRow input { flex:1; min-width:0; height:30px; accent-color:var(--on); }
  #scaleVal { min-width:60px; text-align:right; color:var(--dim); font-variant-numeric:tabular-nums; }
  #tools { margin-top:7px; padding-bottom:0; }

  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:4; height:var(--sheet);
           background:var(--panel); border-top:1px solid var(--line); border-radius:14px 14px 0 0;
           display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  #grab { padding:8px; cursor:pointer; flex:none; }
  #grab .bar { width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto; }
  #tabs { padding:0 8px 6px; flex:none; }
  /* align-items:start so aspect-ratio drives the swatch height instead of the row
     stretching it into a column */
  #grid { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 8px 12px;
          display:grid; grid-template-columns:repeat(auto-fill, minmax(56px, 1fr)); gap:6px;
          align-content:start; align-items:start; }
  /* padding-top:100% for the square, not aspect-ratio: percentage padding resolves
     against the element's own width, which the 1fr column makes definite. aspect-ratio
     did not resolve during row sizing, so rows collapsed to 31px and swatches overlapped. */
  .sw { position:relative; width:100%; padding-top:100%; border-radius:8px; overflow:hidden;
        cursor:pointer; border:2px solid transparent; background:#0c0e15; }
  .sw.on { border-color:var(--on); }
  .sw img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .sw span { position:absolute; left:0; right:0; bottom:0; font-size:10px; text-align:center;
             background:#000a; padding:1px 0; }
  #clear { grid-column:1/-1; width:100%; }

  @media (max-width: 480px) {
    button { padding:7px 10px; min-height:34px; font-size:13px; border-radius:8px; }
    button.part { padding:6px 8px; min-height:32px; font-size:12px; }
    #top { padding-top:calc(env(safe-area-inset-top) + 4px); }
    .row { gap:5px; padding-bottom:4px; }
  }
</style>
  <script type="module" crossorigin src="/harness/materials/assets/index-B5YGueYc.js"></script>
</head>
<body>
  <div id="top">
    <div class="row" id="buildings"></div>
    <div class="row" id="tiers"></div>
  </div>

  <div id="status">
    <div id="partsBar">
      <button id="prev" class="step" title="previous part">&lsaquo;</button>
      <div class="row" id="parts"></div>
      <button id="next" class="step" title="next part">&rsaquo;</button>
    </div>
    <div id="hint">loading…</div>
    <div id="scaleRow">
      <span style="color:var(--dim)">scale</span>
      <input id="scale" type="range" min="0.3" max="4" step="0.05" value="1.1" />
      <span id="scaleVal">1.10 m</span>
    </div>
    <div class="row" id="tools"></div>
  </div>

  <div id="sheet">
    <div id="grab"><div class="bar"></div></div>
    <div class="row" id="tabs"></div>
    <div id="grid"></div>
  </div>

</body>
</html>
